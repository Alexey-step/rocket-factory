services:
  # Envoy Proxy (API Gateway с аутентификацией)
  envoy:
    image: envoyproxy/envoy:v1.34.0
    container_name: envoy
    env_file:
      - .env
    volumes:
      - ../../../deploy/envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
      - ../../../shared/pkg/proto/inventory/v1/inventory_descriptor.pb:/etc/envoy/inventory_descriptor.pb:ro
      - ../../../shared/pkg/proto/auth/v1/auth_descriptor.pb:/etc/envoy/auth_descriptor.pb:ro
      - ../../../shared/pkg/proto/user/v1/user_descriptor.pb:/etc/envoy/user_descriptor.pb:ro
    ports:
      - "${ENVOY_PORT}:8080"      # HTTP API с аутентификацией
      - "${ENVOY_ADMIN_PORT}:8081" # Envoy admin interface
    environment:
      - ENVOY_UID=0  # Права для доступа к файлам
    healthcheck:
      test: [ "CMD-SHELL", "timeout 1 bash -c '</dev/tcp/0.0.0.0/8081'" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
      - microservices-net
      # Подключаемся к общей сети для взаимодействия с другими микросервисами

networks: # Определение используемой сети
  microservices-net:
    external: true
    # Мы не создаём новую сеть, а подключаемся к внешней, общей для всех микросервисов
    # Её должен создать docker-compose.yml или вручную: docker network create microservices-net